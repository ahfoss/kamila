name: Deploy Shinylive App to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - export_ci_pipeline_results
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Shinylive R package
        run: |
          Rscript -e 'install.packages("shinylive", repos = "https://cloud.r-project.org")'

      - name: Export Shinylive App
        run: |
          Rscript -e 'shinylive::export(appdir = "inst/shiny/horserace", destdir = "site")'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
